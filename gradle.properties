# Bật hỗ trợ AndroidX cho Android Gradle Plugin 8+
android.useAndroidX=true
# TẮT Jetifier vì các thư viện hiện đại đã dùng AndroidX, Jetifier cũ sẽ lỗi với Java 21 bytecode (major version 65)
android.enableJetifier=false

# Tối ưu bộ nhớ JVM cho Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
